# org.gradle.java.home 原本指向作者电脑的 JDK（E:\DevTools\...），其它电脑/云端不存在会导致无法构建，已停用。
# 请通过环境变量 JAVA_HOME 指定 JDK 17+（Android Studio 自带 JBR 即可），或删除本注释。
# org.gradle.java.home=E\:/DevTools/Android\ Studio/jbr
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
org.gradle.daemon=true

# Optimization flags for smaller APK size
android.enableR8.fullMode=true
android.enableResourceOptimizations=true
kotlin.incremental=false
android.suppressUnsupportedCompileSdk=35,36
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
