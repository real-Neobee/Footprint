
name: Android Build (打包 APK)

# 触发方式：推送到 master/main 分支，或在 Actions 页面手动点击 Run workflow
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Flutter（stable 通道）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Flutter 模块的 .android 目录
        # settings.gradle.kts 会加载 flutter_ui/.android/include_flutter.groovy。
        # 该目录由 Flutter 工具生成、已被 gitignore，这里先 flutter pub get 自动生成。
        working-directory: flutter_ui
        run: |
          flutter pub get
          if [ ! -d .android ]; then
            echo "::error::flutter pub get 未能生成 .android 目录，请检查 Flutter 版本"
            exit 1
          fi
          echo ".android 目录内容："
          ls .android

      - name: 安装 Rust 目标与 cargo-ndk（编译原生渲染库）
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: 准备 Android SDK 组件（platform 35 / build-tools / NDK）
        run: |
          SDK="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" >/dev/null 2>&1 || true
          if [ -d "$SDK/ndk" ] && [ -n "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
            NDK_VERSION=$(ls "$SDK/ndk" | sort -V | tail -1)
          else
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" >/dev/null 2>&1 || true
            NDK_VERSION="26.3.11579264"
          fi
          echo "使用 NDK 版本: $NDK_VERSION"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 生成 local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "${{ secrets.AMAP_KEY }}" ]; then
            echo "AMAP_KEY=${{ secrets.AMAP_KEY }}" >> local.properties
          else
            echo "AMAP_KEY=YOUR_AMAP_API_KEY" >> local.properties
          fi
          cat local.properties

      - name: 配置 Release 签名（读取 Secrets，未设置则跳过）
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
            printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
              > keystore.properties
            echo "已按 Secrets 生成签名配置，Release 将输出已签名 APK。"
          else
            echo "未检测到 KEYSTORE_BASE64 等 Secrets：本次 Release 为未签名包；Debug 包不受影响。"
            echo "需要正式签名包请先运行“生成 Release 签名文件”工作流并配置 Secrets，详见 BUILD_APK_GUIDE.md"
          fi

      - name: 赋予 gradlew 执行权限（Windows 提交时 Git 会丢失执行位）
        run: chmod +x gradlew

      - name: 统一 Gradle wrapper 为 8.14（官方源）并打印诊断
        run: |
          echo '===== 仓库内所有 gradle-wrapper.properties（统一改为 8.14）====='
          find . -path ./.git -prune -o -name gradle-wrapper.properties -print | while read -r f; do
            echo "---- $f ----"
            printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > "$f"
            cat "$f"
          done
          echo '===== ./gradlew --version ====='
          ./gradlew --version

      - name: 构建 APK（Debug + Release）
        run: ./gradlew --no-daemon --init-script .github/ci-repos.init.gradle assembleDebug assembleRelease

      - name: 上传 Debug APK（可直接安装试用）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app_build_fresh/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: 上传 Release APK（已签名或未签名）
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app_build_fresh/outputs/apk/release/app-release.apk
            build/app_build_fresh/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
