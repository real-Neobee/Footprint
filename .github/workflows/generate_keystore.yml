
name: 生成 Release 签名文件 (keystore)

# 仅手动运行：Actions 页面 -> 左侧选择本工作流 -> Run workflow
on:
  workflow_dispatch:
    inputs:
      password:
        description: '密钥库密码（务必牢记；建议同时作为 Key 密码，仅用字母数字）'
        required: true
        default: 'footprint2026'
      alias:
        description: 'Key 别名'
        required: true
        default: 'footprint'
      name:
        description: '姓名或组织名（仅用于证书显示，可随意）'
        required: true
        default: 'Footprint'

jobs:
  generate:
    name: 生成 keystore 并显示 SHA1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 生成 release-keystore.jks
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -storepass "${{ github.event.inputs.password }}" \
            -alias "${{ github.event.inputs.alias }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=${{ github.event.inputs.name }}, OU=Footprint, O=Footprint, L=City, ST=State, C=CN"

      - name: 显示 SHA1（申请高德 Key 时要用）
        run: |
          keytool -list -v -keystore release-keystore.jks \
            -storepass "${{ github.event.inputs.password }}" \
            -alias "${{ github.event.inputs.alias }}" \
            | grep "SHA1:" | head -1

      - name: 上传 keystore 文件（下载后妥善保管，勿上传到公开仓库）
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release-keystore.jks
